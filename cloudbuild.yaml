steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '--build-arg', 'VITE_GEMINI_API_KEY=${_VITE_GEMINI_API_KEY}', '-t', 'gcr.io/$PROJECT_ID/growyouravatar', '.']

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/growyouravatar']

  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'growyouravatar'
      - '--image'
      - 'gcr.io/$PROJECT_ID/growyouravatar'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--port'
      - '8080'
      - '--allow-unauthenticated'

substitutions:
  _VITE_GEMINI_API_KEY: '' # Default value, will be overridden by the trigger or command line

options:
  logging: CLOUD_LOGGING_ONLY
